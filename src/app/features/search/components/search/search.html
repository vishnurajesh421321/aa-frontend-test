<div class="flex flex-center">
  <div class="search-box">
    <app-search-suggest
      (onSearch)="getAllBreweries($event)"
      [optionLabel]="'name'"
      [formControl]="selectedItem"
      [loading]="breweriesRequest.isLoading()"
      [itemKey]="'name'" [items]="breweriesRequest.data()"/>
  </div>
</div>

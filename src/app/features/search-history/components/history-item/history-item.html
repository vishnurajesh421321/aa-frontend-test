<p title="{{ title() }}" class="item-title">
  <span>{{ title() }}</span>
  <span class="dash">-</span>
  <span>{{ date() }}</span>
</p>

<button tabindex="-1" type="button" class="search-history__remove" (click)="handleOnRemove($event)">
  <app-icon [width]="15" [height]="15" icon="close" />
</button>
